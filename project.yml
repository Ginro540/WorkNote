name: WorkNote
options:
  bundleIdPrefix: jp.co.home-search
  deploymentTarget:
    iOS: "18.0"
  developmentLanguage: ja
  createIntermediateGroups: true
packages:
  Firebase:
    url: https://github.com/firebase/firebase-ios-sdk
    from: 12.0.0
  WorkNoteCore:
    path: WorkNoteCore
settings:
  base:
    MARKETING_VERSION: 0.1.0
    CURRENT_PROJECT_VERSION: 1
    SWIFT_VERSION: "5.0"
targets:
  WorkNote:
    type: application
    platform: iOS
    sources:
      - path: WorkNote
    dependencies:
      - package: Firebase
        product: FirebaseAuth
      - package: Firebase
        product: FirebaseFirestore
      - package: Firebase
        product: FirebaseStorage
      - package: WorkNoteCore
    info:
      path: WorkNote/Info.plist
      properties:
        CFBundleDisplayName: ワークノート
        CFBundleDevelopmentRegion: ja
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        NSLocationWhenInUseUsageDescription: 出勤・退勤を押した瞬間の場所を、打刻場所の確認のために1回だけ記録します。勤務中に位置を追い続けることはありません。
        NSCameraUsageDescription: 領収書や日報の写真を撮影するために使います。
        NSPhotoLibraryUsageDescription: アルバムから領収書や日報の写真を選ぶために使います。
        ITSAppUsesNonExemptEncryption: false
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: jp.co.home-search.worknote
        PRODUCT_NAME: WorkNote
        TARGETED_DEVICE_FAMILY: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: ""
        ENABLE_PREVIEWS: YES
        OTHER_LDFLAGS: $(inherited) -ObjC
schemes:
  WorkNote:
    build:
      targets:
        WorkNote: all
    run:
      config: Debug
    archive:
      config: Release
